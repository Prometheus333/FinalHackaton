<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCS Capital Markets // AI Terminal</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { --accent:#10b981; --accent-blue:#33c9ff; --panel:#0a0a0a; --panel-2:#050505; --border:#1e293b; }
  body { background:#000; font-family: ui-monospace, monospace; }
  .panel { background:var(--panel); border:1px solid var(--border); }
  .panel-2 { background:var(--panel-2); border:1px solid var(--border); }
  ::-webkit-scrollbar { width:4px; height:4px; }
  ::-webkit-scrollbar-thumb { background:#1e293b; border-radius:2px; }

  /* Animated quadrants: ONE single transition on the grid.
     No position:absolute and no DOM reordering, which is why the
     panels never fight each other and the chart never flickers. */
  #grid {
    display:grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    transition: grid-template-columns .55s cubic-bezier(.4,0,.2,1),
                grid-template-rows    .55s cubic-bezier(.4,0,.2,1);
  }
  .quad { transition: opacity .4s ease, border-color .4s ease, box-shadow .4s ease; min-width:0; min-height:0; }
  .quad.dimmed { opacity:.45; }
  .quad.focused { border-color:var(--accent); box-shadow:0 0 26px rgba(16,185,129,.18); }
  .quad.dimmed .collapsible { opacity:0; transition:opacity .2s; }

  @keyframes ticker-scroll { from{transform:translateX(0)} to{transform:translateX(-50%)} }
  .ticker-track { animation: ticker-scroll 30s linear infinite; }
  @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.3} }
  .live-dot { animation: pulse-dot 1.4s ease-in-out infinite; }
  .fade-in { animation: fadeIn .25s ease-out; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
  @keyframes flashUp { from{background:rgba(16,185,129,.35)} to{background:transparent} }
  @keyframes flashDown { from{background:rgba(239,68,68,.35)} to{background:transparent} }
  .flash-up { animation: flashUp .6s ease-out; } .flash-down { animation: flashDown .6s ease-out; }

  .chat-msg-user { background:#111827; text-align:right; border-left:2px solid #3b82f6; }
  .chat-msg-ai   { background:#050505; border-left:2px solid var(--accent); white-space:pre-wrap; }
  .chat-msg-sys  { background:#0a0a0a; border-left:2px solid #52525b; color:#71717a; font-size:10px; }
  .tf-btn.active { background:#10b981; color:#000; font-weight:bold; border-color:#10b981; }
  .ind-btn { padding:3px 5px; border:1px solid var(--border); color:#6b7280;
             display:inline-flex; align-items:center; transition: all .18s ease; }
  .ind-btn:hover { border-color:#33c9ff; color:#9ca3af; }
  .ind-btn.on { background:#0e2a3a; border-color:var(--accent-blue); color:var(--accent-blue); font-weight:bold; }

  @keyframes ring { 0%{box-shadow:0 0 0 0 rgba(16,185,129,.55)} 70%{box-shadow:0 0 0 12px rgba(16,185,129,0)} 100%{box-shadow:0 0 0 0 rgba(16,185,129,0)} }
  #voiceBtn.calling { animation: ring 1.6s infinite; background:#dc2626; }
  #vizBars span { display:inline-block; width:2px; height:4px; background:var(--accent); margin:0 1px; animation: bounce .9s infinite ease-in-out; }
  @keyframes bounce { 0%,100%{height:4px} 50%{height:13px} }

  /* Generic, NOT scoped to one id: any element carrying .hidden-modal must
     actually disappear and stop swallowing clicks. */
  #newsModal, #predictModal, #simModal { transition: opacity .3s ease, transform .3s ease; }
  .hidden-modal { opacity:0; transform:translateY(12px) scale(.98); pointer-events:none; }
  .hidden-modal * { pointer-events:none; }
</style>
</head>
<body class="text-gray-300 h-screen flex flex-col overflow-hidden">

  <header class="panel-2 border-b border-[var(--border)] px-4 py-2 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <div id="liveDot" class="w-2.5 h-2.5 rounded-full bg-gray-600"></div>

      <span id="srcBadge" class="text-xs text-gray-500 border border-[var(--border)] px-2 py-0.5">CONNECTING…</span>
      <span id="callState" class="text-xs text-gray-600"></span>
      <span id="liveMic" class="hidden text-emerald-400 live-dot" title="Listening"></span>
      <span id="ttsBadge" class="text-[9px] px-1.5 border text-gray-600 border-[var(--border)]" title="Voice engine"></span>
    </div>
    <div id="clock" class="text-xs text-emerald-300 tabular-nums"></div>
  </header>

  <div class="panel-2 border-b border-[var(--border)] overflow-hidden whitespace-nowrap py-1 shrink-0">
    <div id="tickerTrack" class="ticker-track inline-flex gap-10 px-4 text-xs"></div>
  </div>

  <main id="grid" class="flex-1 gap-2 p-2 overflow-hidden">

    <section id="q-watchlist" class="quad relative panel p-3 flex flex-col overflow-hidden">
      <div class="flex justify-between items-center mb-2 shrink-0">
        <h2 class="text-xs uppercase tracking-widest text-emerald-400 font-bold">Watchlist</h2>
        <div class="flex items-center gap-2">
          <span class="text-[9px] text-gray-600" id="wlCount"></span>
          <button id="simBtn" title="Simulate investing in this watchlist"
                  class="px-1.5 py-0.5 border border-amber-800 text-amber-400 hover:border-amber-400 flex items-center"></button>
        </div>
      </div>
      <div class="relative shrink-0 mb-2">
        <input id="searchInput" type="text" autocomplete="off" placeholder="Search: apple, vanguard, SPY..."
          class="w-full bg-black border border-[var(--border)] px-2 py-1 text-[11px] text-white focus:outline-none focus:border-emerald-400">
        <div id="searchResults" class="absolute z-30 left-0 right-0 top-full mt-1 panel-2 border border-emerald-900 max-h-52 overflow-y-auto hidden"></div>
      </div>

    </section>

    <section id="q-chart" class="quad relative panel p-3 flex flex-col overflow-hidden">
      <div class="flex items-center justify-between mb-1 shrink-0">
        <div class="flex items-center gap-2 min-w-0">
          <span id="activeSymbol" class="text-lg font-bold text-white">AAPL</span>
          <span id="activeName" class="text-[10px] text-gray-600 truncate"></span>
          <span id="activePrice" class="text-sm text-emerald-300 tabular-nums">—</span>
          <span id="activeChange" class="text-xs tabular-nums">—</span>
        </div>
        <div class="flex gap-1 text-[10px] shrink-0">
          <button data-tf="15Min" class="tf-btn px-1.5 py-0.5 border border-[var(--border)] hover:border-emerald-400">15m</button>
          <button data-tf="1Hour" class="tf-btn px-1.5 py-0.5 border border-[var(--border)] hover:border-emerald-400">1H</button>
          <button data-tf="1Day"  class="tf-btn active px-1.5 py-0.5 border border-[var(--border)] hover:border-emerald-400">1D</button>
          <button data-tf="1Week" class="tf-btn px-1.5 py-0.5 border border-[var(--border)] hover:border-emerald-400">1W</button>
          <button id="stratBtn" title="Strategy Lab: backtest and recommend" class="px-1.5 py-0.5 border border-violet-800 text-violet-400 hover:border-violet-400 flex items-center"></button>
          <button id="predictBtn" title="AI prediction: buy point, sell point, stop loss" class="px-1.5 py-0.5 border border-cyan-800 text-cyan-400 hover:border-cyan-400 flex items-center"></button>
          <button id="clearBtn" title="Clear chart" class="px-1.5 py-0.5 border border-[var(--border)] text-red-400 hover:border-red-400 flex items-center"></button>
        </div>
      </div>
      <div id="toolbar" class="flex flex-wrap gap-1 mb-1 shrink-0"></div>
      <div id="chart" class="flex-1 min-h-0"></div>
      <div class="collapsible mt-1 shrink-0">
        <div id="metrics" class="grid grid-cols-6 gap-1 text-[9px] mb-1"></div>
        <div id="legend" class="flex flex-wrap gap-2 text-[10px] text-gray-400"></div>
      </div>
    </section>

    <section id="q-chat" class="quad relative panel p-3 flex flex-col overflow-hidden">
      <div class="flex justify-between items-center mb-2 shrink-0">
        <h2 class="text-xs uppercase tracking-widest text-emerald-400 font-bold">AI Desk</h2>
        <div class="flex items-center gap-2">

        </div>
      </div>
      <div id="pendingAction" class="hidden shrink-0 mb-2 border border-amber-700 bg-amber-950/30 px-2 py-1.5 text-[10px] text-amber-300"></div>

        <button type="submit" id="sendBtn" title="Send"

          <button id="modalClose" title="Close" class="text-red-400 shrink-0"></button>

        <button id="simClose" title="Close" class="text-red-400"></button>
      </div>
      <div id="simScope" class="text-[10px] text-gray-500 mb-2"></div>
      <div class="flex gap-2 items-center mb-3">
        <span class="text-[10px] text-gray-500">AMOUNT</span>
        <input id="simAmount" type="number" min="1" step="100" value="10000"
               class="bg-black border border-[var(--border)] px-2 py-1 text-xs text-white w-36 focus:outline-none focus:border-amber-400">
        <button id="simRun" class="bg-amber-600 hover:bg-amber-500 text-black text-xs font-bold px-3 py-1">RUN</button>
      </div>
      <div id="simBody" class="text-xs"></div>
    </div>
  </div>

<script>
/* ===================== ICONS =====================
   Inline SVG so there is no icon-font dependency. Every button keeps a
   title attribute: the tooltip is what tells you what it does. */
const svg = (p, extra='') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5" ${extra}>${p}</svg>`;
const ICON = {
  mic:   svg('<path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/>'),
  stop:  svg('<rect x="6" y="6" width="12" height="12" rx="1"/>'),
  send:  svg('<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>'),
  trash: svg('<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>'),
  close: svg('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'),
  link:  svg('<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>'),
  plus:  svg('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'),
  x:     svg('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'),
  // indicators — each silhouette is distinct enough to read at 14px
  sma20:    svg('<path d="M3 16c4-8 8 4 12-2s4-4 6-6"/>'),
  sma50:    svg('<path d="M3 18c5-10 10 2 18-8"/><circle cx="3" cy="18" r="1.4"/>'),
  ema12:    svg('<path d="M3 17c3-2 5-9 9-9s6 8 9 5"/><circle cx="21" cy="13" r="1.4"/>'),
  bollinger:svg('<path d="M3 7c5-3 13-3 18 0"/><path d="M3 17c5 3 13 3 18 0"/><path d="M3 12h18" stroke-dasharray="3 3"/>'),
  vwap:     svg('<path d="M3 12h18" stroke-dasharray="4 2"/><path d="M6 17l4-9 4 9 4-6"/>'),
  volume:   svg('<line x1="5" y1="20" x2="5" y2="13"/><line x1="10" y1="20" x2="10" y2="8"/><line x1="15" y1="20" x2="15" y2="15"/><line x1="20" y1="20" x2="20" y2="5"/>'),
  rsi:      svg('<path d="M3 6h18" stroke-dasharray="2 2"/><path d="M3 18h18" stroke-dasharray="2 2"/><path d="M3 14c4 4 7-8 10-2s5 2 8-4"/>'),
  fib:      svg('<line x1="3" y1="5" x2="21" y2="5"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="3" y1="14" x2="21" y2="14"/><line x1="3" y1="19" x2="21" y2="19"/>'),
  levels:   svg('<line x1="3" y1="8" x2="21" y2="8"/><line x1="3" y1="16" x2="21" y2="16"/><polyline points="6 13 10 11 14 14 18 12"/>'),
  logscale: svg('<path d="M3 20V4"/><path d="M3 20h18"/><path d="M5 18c6 0 8-12 15-13"/>'),
  brain: svg('<path d="M9 3a3 3 0 0 0-3 3v1a3 3 0 0 0 0 6v1a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M15 3a3 3 0 0 1 3 3v1a3 3 0 0 1 0 6v1a3 3 0 0 1-6 0"/>'),
  wallet: svg('<path d="M20 12V8H6a2 2 0 0 1 0-4h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/><circle cx="17" cy="14" r="1.2"/>'),
  collapse: svg('<polyline points="9 4 9 9 4 9"/><polyline points="15 20 15 15 20 15"/><line x1="4" y1="20" x2="9" y2="15"/><line x1="20" y1="4" x2="15" y2="9"/>'),
  pie: svg('<path d="M12 3v9h9"/><circle cx="12" cy="12" r="9"/>'),
  flask: svg('<path d="M9 3v6L4 19a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3l-5-10V3"/><line x1="8" y1="3" x2="16" y2="3"/><line x1="7" y1="14" x2="17" y2="14"/>'),
};

/* ===================== STATE ===================== */
const SESSION_ID = Math.random().toString(36).slice(2);
let watchlist = ["AAPL","MSFT","SPY","TSLA","NVDA"];
let names = {};
let activeSymbol = "AAPL", activeTimeframe = "1Day";
let extraSeries = [], candleSeries, chart;
let lastBar = null, quoteCache = {}, es = null, currentNews = [], lastMetrics = null;
const $ = id => document.getElementById(id);
setInterval(() => $('clock').textContent = new Date().toUTCString().slice(0,25)+" UTC", 1000);

/* ===================== ANIMATED QUADRANTS =====================
   A single state drives the grid. Any later call overwrites the
   previous one: two animations can never collide. */
const LAYOUTS = {
  balanced:  { cols:'1fr 1fr',   rows:'1fr 1fr' },
  watchlist: { cols:'2.6fr 1fr', rows:'2.6fr 1fr' },
  chart:     { cols:'1fr 2.8fr', rows:'2.8fr 1fr' },
  chat:      { cols:'2.6fr 1fr', rows:'1fr 2.6fr' },
  news:      { cols:'1fr 2.8fr', rows:'1fr 2.8fr' },
};
function focusPanel(panel){
  const l = LAYOUTS[panel] || LAYOUTS.balanced;
  $('grid').style.gridTemplateColumns = l.cols;
  $('grid').style.gridTemplateRows    = l.rows;
  ['watchlist','chart','chat','news'].forEach(p=>{
    const el = $('q-'+p);
    el.classList.toggle('focused', p===panel && panel!=='balanced');
    el.classList.toggle('dimmed',  panel!=='balanced' && p!==panel);
  });
  syncCollapseButtons(panel);
  clearTimeout(window.__fitT);
  window.__fitT = setTimeout(()=>{ try{ chart.timeScale().fitContent(); }catch(e){} }, 620);
  return `Panel ${panel} focused`;
}

/* ===================== CHART ===================== */
function initChart(){
  chart = LightweightCharts.createChart($('chart'), {
    layout:{background:{color:'transparent'},textColor:'#9fb3c8'},
    grid:{vertLines:{color:'#111827'},horzLines:{color:'#111827'}},
    rightPriceScale:{borderColor:'#1e293b'},
    timeScale:{borderColor:'#1e293b', timeVisible:true},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal}, autoSize:true,
  });
  candleSeries = chart.addCandlestickSeries({
    upColor:'#10b981', downColor:'#ef4444', borderVisible:false,
    wickUpColor:'#10b981', wickDownColor:'#ef4444',
  });
}

async function loadSymbol(symbol, timeframe=null){
  activeSymbol = symbol.toUpperCase();
  if(timeframe) activeTimeframe = timeframe;
  $('activeSymbol').textContent = activeSymbol;
  $('activeName').textContent = names[activeSymbol] || '';
  document.querySelectorAll('.tf-btn').forEach(b=>b.classList.toggle('active', b.dataset.tf===activeTimeframe));

  const d = await (await fetch(`/api/bars/${activeSymbol}?timeframe=${activeTimeframe}&limit=250`)).json();
  if(!d.bars || !d.bars.length) return null;
  candleSeries.setData(d.bars.map(b=>({time:b.time,open:b.open,high:b.high,low:b.low,close:b.close})));
  lastBar = d.bars[d.bars.length-1];
  clearExtraSeries();
  updatePriceHeader(d.bars);
  setSourceBadge(d.source, d.feed, d.stale, lastBar && lastBar.time);
  chart.timeScale().fitContent();
  highlightWatchlist(activeSymbol);
  refreshNews({symbol:activeSymbol});
  redrawIndicators();
  return loadMetrics(activeSymbol);
}

function setSourceBadge(source, feed, stale, asOf){
  const el=$('srcBadge');
  if(source==='alpaca' && stale){
    el.textContent=`ALPACA · STALE · last bar ${asOf||'?'}`;
    el.className='text-xs text-amber-400 border border-amber-800 px-2 py-0.5';
  } else if(source==='alpaca'){
    el.textContent=`ALPACA · ${(feed||'').toUpperCase()} · ${asOf||''}`;
    el.className='text-xs text-emerald-400 border border-emerald-900 px-2 py-0.5';
  } else {
    el.textContent='SIMULATED DATA - not tradable';
    el.className='text-xs text-amber-400 border border-amber-800 px-2 py-0.5';
  }
}

async function loadMetrics(sym){
  const m = await (await fetch(`/api/analysis/${sym}`)).json();
  lastMetrics = m;
  const cells = [
    ['RSI14', m.rsi14], ['ATR%', m.atr14_pct], ['Vol.a%', m.annualized_vol_pct],
    ['SMA20', m.sma20], ['SMA50', m.sma50], ['52w%', m.pos_in_52w_range_pct],
    ['1d%', m.change_pct?.['1d']], ['5d%', m.change_pct?.['5d']],
    ['20d%', m.change_pct?.['20d']], ['60d%', m.change_pct?.['60d']],
    ['Trend', m.trend], ['RelVol', m.relative_volume],
  ].filter(([, v]) => v !== undefined && v !== null && v !== '');
  // Only render what actually has a value: empty cells look like a broken feed.
  $('metrics').innerHTML = cells.map(([k,v])=>{
    const signed = typeof v==='number' && k.endsWith('%') && !['ATR%','Vol.a%','52w%'].includes(k);
    const color = signed ? (v>=0?'text-emerald-400':'text-red-400') : 'text-gray-300';
    return `<div class="panel-2 px-1 py-0.5"><div class="text-gray-600">${k}</div><div class="${color} tabular-nums">${v}</div></div>`;
  }).join('');
  return m;
}

function updatePriceHeader(bars){
  const last=bars[bars.length-1], prev=bars[bars.length-2]||last;
  applyPrice(last.close, last.close-prev.close, prev.close?(last.close-prev.close)/prev.close*100:0);
}
function applyPrice(price,chg,pct){

/* ===================== PROACTIVE DESK =====================
   The assistant opens the session and keeps watching. It speaks up on its own
   when something crosses a threshold, instead of waiting to be asked. */
let monitorTimer = null, alertedKeys = new Set();

async function runBriefing(speakIt=true){
  try{
    const b = await (await fetch(`/api/briefing?symbols=${watchlist.join(',')}`)).json();
    (b.quotes||[]).forEach(applyQuote);
    if(!b.alerts || !b.alerts.length){
      const line = 'Watchlist is quiet — nothing has moved more than two percent.';
      appendChat('ai', line);
      if(speakIt) await speak(line);
      return line;
    }
    focusPanel('watchlist');
    const line = 'Here is what moved: ' + b.alerts.map(a=>a.text).join('. ') + '.';
    appendChat('ai', line);
    b.alerts.forEach(a=>alertedKeys.add(a.symbol+a.kind));
    if(speakIt) await speak(line);
    return line;
  }catch(e){ return 'Briefing unavailable.'; }
}

/* Background watch during a call: only interrupts on something NEW. */
async function monitorTick(){
  if(!callActive || speaking) return;
  try{
    const b = await (await fetch(`/api/briefing?symbols=${watchlist.join(',')}`)).json();
    (b.quotes||[]).forEach(applyQuote);
    const fresh = (b.alerts||[]).filter(a=>!alertedKeys.has(a.symbol+a.kind));
    if(!fresh.length) return;
    fresh.forEach(a=>alertedKeys.add(a.symbol+a.kind));
    const top = fresh[0];
    const line = `Heads up — ${top.text}. Want me to pull it up?`;
    appendChat('ai', line);
    focusPanel('watchlist');
    await speak(line);
  }catch(e){}
}

async function recommendFor(symbol){
  const r = await (await fetch(`/api/recommendation/${symbol||activeSymbol}`)).json();
  if(r.error) return `No data for ${symbol}.`;
  return JSON.stringify({symbol:r.symbol, price:r.price, bias:r.bias,
    conviction:r.conviction, signals:r.signals, news_tone:r.news_tone,
    news_drivers:(r.news_drivers||[]).map(d=>d.tone+' '+d.title),
    stop:r.stop, target:r.target, stale:r.stale});
}

/* ===================== TOPIC -> PANEL =====================
   The panel follows the conversation without waiting for the model to decide.
   Deterministic, instant, and it still works if the LLM skips the command. */
const TOPIC_WORDS = {
  news:      ['news','headline','headlines','article','story','stories','press','report',
              'noticia','noticias','titular','titulares','articulo','artículo','prensa'],
  watchlist: ['watchlist','watch list','portfolio','my list','add ','remove ','delete ',
              'lista','cartera','agrega','añade','anade','quita','elimina','borra'],
  chart:     ['chart','graph','candle','candles','projection','project','forecast','trend',
              'indicator','rsi','moving average','bollinger','vwap','fibonacci','support',
              'resistance','volume','price','grafica','gráfica','grafico','gráfico','vela',
              'velas','proyeccion','proyección','tendencia','indicador','soporte','resistencia'],
};
let lastTopic = null;

function detectTopic(text){
  const t = ' ' + text.toLowerCase() + ' ';
  let best = null, bestScore = 0;
  for(const [panel, words] of Object.entries(TOPIC_WORDS)){
    const score = words.reduce((a,w)=> a + (t.includes(w) ? 1 : 0), 0);
    if(score > bestScore){ bestScore = score; best = panel; }
  }
  return bestScore > 0 ? best : null;
}

function autoFocusFromText(text){
  const topic = detectTopic(text);
  if(topic && topic !== lastTopic){
    lastTopic = topic;
    focusPanel(topic);
    if(topic === 'news') refreshNews({symbol:activeSymbol});
  }
}

/* ===================== TRADING TOOLS =====================
   Every overlay is computed server-side, so the buttons and the assistant
   always draw from the same numbers. */
const IND_STYLE = {
  sma20:{color:'#f59e0b',w:1.5}, sma50:{color:'#a855f7',w:1.5}, ema12:{color:'#22d3ee',w:1.5},
  bb_upper:{color:'#64748b',w:1,dash:true}, bb_lower:{color:'#64748b',w:1,dash:true},
  vwap:{color:'#ec4899',w:1.5}, rsi14:{color:'#33c9ff',w:1.5},
};
const indState = {};        // indicador -> true/false
const indSeries = {};       // indicador -> [series de lightweight-charts]
let volumeSeries = null, logScale = false;

function setIndButton(ind, on){
  const b = document.querySelector(`[data-ind="${ind}"]`);
  if(b) b.classList.toggle('on', !!on);
}

function dropIndicator(ind){
  (indSeries[ind]||[]).forEach(s=>{ try{ chart.removeSeries(s); }catch(e){} });
  delete indSeries[ind];
  indState[ind] = false;
  setIndButton(ind, false);
}

async function toggleIndicator(ind, force=null){
  const on = force === null ? !indState[ind] : !!force;

  if(ind === 'logscale'){
    logScale = on;
    chart.priceScale('right').applyOptions({mode: on ? 1 : 0});
    indState[ind]=on; setIndButton(ind,on);
    return `Log scale ${on?'on':'off'}`;
  }

  if(ind === 'volume'){
    if(!on){ if(volumeSeries){ chart.removeSeries(volumeSeries); volumeSeries=null; }
      indState[ind]=false; setIndButton(ind,false); return 'Volume off'; }
    const d = await (await fetch(`/api/bars/${activeSymbol}?timeframe=${activeTimeframe}&limit=250`)).json();
    volumeSeries = chart.addHistogramSeries({priceScaleId:'vol', priceFormat:{type:'volume'}});
    chart.priceScale('vol').applyOptions({scaleMargins:{top:0.82, bottom:0}});
    volumeSeries.setData(d.bars.map(b=>({time:b.time, value:b.volume,
      color: b.close>=b.open ? 'rgba(16,185,129,.45)' : 'rgba(239,68,68,.45)'})));
    indState[ind]=true; setIndButton(ind,true); return 'Volume on';
  }

  if(!on){ dropIndicator(ind); return `${ind.toUpperCase()} off`; }

  const d = await (await fetch(`/api/indicators/${activeSymbol}?which=${ind}&timeframe=${activeTimeframe}`)).json();
  const created = [];

  Object.entries(d.series||{}).forEach(([name, pts])=>{
    if(!pts || !pts.length) return;
    const st = IND_STYLE[name] || {color:'#94a3b8', w:1.5};
    const opts = {color:st.color, lineWidth:st.w, priceLineVisible:false, lastValueVisible:false};
    if(st.dash) opts.lineStyle = LightweightCharts.LineStyle.Dashed;
    if(name === 'rsi14'){                       // panel propio abajo
      opts.priceScaleId = 'rsi'; opts.lastValueVisible = true;
      chart.priceScale('rsi').applyOptions({scaleMargins:{top:0.78, bottom:0}, visible:true});
    }
    const s = chart.addLineSeries(opts);
    s.setData(pts);
    created.push(s);
  });

  // Fibonacci and support/resistance as horizontal price lines
  if((d.levels||[]).length){
    const holder = chart.addLineSeries({lastValueVisible:false, priceLineVisible:false,
      color:'rgba(0,0,0,0)'});
    d.levels.forEach(l=>{
      holder.createPriceLine({price:l.price, color: l.kind==='res' ? '#ef4444'
        : l.kind==='sup' ? '#10b981' : '#eab308',
        lineWidth:1, lineStyle:LightweightCharts.LineStyle.Dotted,
        axisLabelVisible:true, title:l.label});
    });
    created.push(holder);
  }

  indSeries[ind]=created; indState[ind]=true; setIndButton(ind,true);
  return `${ind.toUpperCase()} on`;
}

function clearAllIndicators(){
  Object.keys(indSeries).forEach(dropIndicator);
  if(volumeSeries){ try{chart.removeSeries(volumeSeries);}catch(e){} volumeSeries=null;
    indState.volume=false; setIndButton('volume',false); }
}

async function addToWatchlist(sym, name){
  sym=(sym||'').toUpperCase();
  if(!name){
    const r=await (await fetch(`/api/search?q=${encodeURIComponent(sym)}&limit=1`)).json();
    if(!r.length) return {ok:false, message:`No instrument found matching "${sym}"`};
    sym=r[0].symbol; name=r[0].name;
  }
  names[sym]=name;
  if(!watchlist.includes(sym)) watchlist.push(sym);
  renderWatchlist(); connectStream(); refreshDiversification(); await loadSymbol(sym);
  logSystem(`+ ${sym} added to the watchlist`);
  return {ok:true, message:`${sym} (${name}) added and loaded on the chart`};
}
function removeFromWatchlist(sym){
  sym=(sym||'').toUpperCase();
  if(watchlist.length<=1) return {ok:false, message:'The watchlist cannot be left empty'};
  if(!watchlist.includes(sym)) return {ok:false, message:`${sym} is not in the watchlist`};
  watchlist=watchlist.filter(s=>s!==sym); delete quoteCache[sym];
  if(activeSymbol===sym) loadSymbol(watchlist[0]);
  renderWatchlist(); connectStream(); refreshDiversification();
  logSystem(`- ${sym} removed from the watchlist`);
  return {ok:true, message:`${sym} removed`};
}

function applyQuote(q){
  quoteCache[q.symbol]=q;
  const px=document.querySelector(`[data-px="${q.symbol}"]`);
  if(px){
    const prev=parseFloat(px.textContent);
    px.textContent=q.price.toFixed(2);
    px.className='tabular-nums '+(q.change>=0?'text-emerald-300':'text-red-300');
    if(!isNaN(prev)&&prev!==q.price){ px.classList.remove('flash-up','flash-down'); void px.offsetWidth;
      px.classList.add(q.price>prev?'flash-up':'flash-down'); }
  }
  const pct=document.querySelector(`[data-pct="${q.symbol}"]`);
  if(pct && q.change_pct !== undefined){ pct.textContent=`${q.change_pct>=0?'+':''}${q.change_pct}%`;
    pct.className='tabular-nums text-[10px] '+(q.change_pct>=0?'text-emerald-500':'text-red-500'); }
  if(q.symbol===activeSymbol){
    applyPrice(q.price,q.change,q.change_pct);
    if(lastBar) candleSeries.update({time:lastBar.time,open:lastBar.open,
      high:Math.max(lastBar.high,q.price), low:Math.min(lastBar.low,q.price), close:q.price});
  }
  renderTicker();
}
function renderTicker(){
  const html=Object.values(quoteCache).map(q=>{
    const c=q.change_pct>=0?'text-emerald-300':'text-red-300';
    return `<span class="text-gray-400">${q.symbol} <span class="${c}">${q.price.toFixed(2)} ${q.change_pct>=0?'+':''}${q.change_pct}%</span></span>`;
  }).join('');
  $('tickerTrack').innerHTML=html+html;
}
function connectStream(){
  if(es) es.close();
  es=new EventSource(`/api/stream?symbols=${watchlist.join(',')}`);
  es.addEventListener('quotes', e=>{
    $('liveDot').className='w-2.5 h-2.5 rounded-full bg-emerald-500 live-dot';
    JSON.parse(e.data).quotes.forEach(applyQuote);
  });
  es.onerror=()=>{ $('liveDot').className='w-2.5 h-2.5 rounded-full bg-red-600'; };
}

/* ===================== NEWS ===================== */
async function refreshNews({symbol=null, topic=null, keywords=null}={}){
  let url='/api/news?';
  if(topic)  url+=`topic=${encodeURIComponent(topic)}&`;
  if(symbol) url+=`symbol=${encodeURIComponent(symbol)}&`;
  if(keywords) url+=`keywords=${encodeURIComponent(keywords.join(','))}`;
  const items=await (await fetch(url)).json();
  currentNews=items;
  $('newsTopic').textContent = topic ? `TEMA: ${topic}` : (symbol||'');
  $('newsList').innerHTML=items.map((it,i)=>`
    <div class="fade-in panel-2 border border-[var(--border)] p-2 cursor-pointer hover:border-emerald-600" data-news="${i}">
      <div class="flex gap-2">
        <span class="text-emerald-600 font-bold shrink-0">${i+1}</span>
        <div class="min-w-0">
          <div class="text-orange-300 leading-snug">${it.title}</div>
          <div class="text-gray-600 mt-0.5 text-[10px]">${it.source||''}${it.summary?' · '+it.summary.slice(0,90):''}</div>
        </div>
      </div></div>`).join('');
  return items.slice(0,8).map((it,i)=>`${i+1}. ${it.title}`).join(' | ');
}
$('newsList').addEventListener('click', e=>{
  const el=e.target.closest('[data-news]'); if(el) openNews(+el.dataset.news+1);
});

async function openNews(index){
  const it=currentNews[index-1];
  if(!it) return {ok:false, message:`There is no news item number ${index}`};
  focusPanel('news');
  $('modalTitle').textContent=it.title;
  $('modalLink').href=it.link;
  $('modalBody').textContent='Loading article...';
  $('newsModal').classList.remove('hidden-modal');
  let text=it.summary||'';
  try{
    const art=await (await fetch(`/api/article?url=${encodeURIComponent(it.link)}`)).json();
    if(art.text && art.text.length>200) text=art.text;
  }catch(e){}
  $('modalBody').textContent=text||'Could not extract the article body.';
  logSystem(`News item ${index} opened`);
  return {ok:true, title:it.title, source:it.source, content:text.slice(0,2500)};
}
$('modalClose').onclick=()=>$('newsModal').classList.add('hidden-modal');

  const div=document.createElement('div');
  div.className=`fade-in px-2 py-1.5 text-xs ${cls}`;

function applyCommand(cmd){
  switch(cmd.action){
    case 'add_projection': addDashedSeries(cmd.points,cmd.label,'#33c9ff'); focusPanel('chart'); break;
    case 'add_scenario':   addDashedSeries(cmd.points,cmd.label,'#ff9900'); focusPanel('chart'); break;
    case 'set_symbol':     loadSymbol(cmd.symbol); break;
    case 'filter_news':    refreshNews({symbol:activeSymbol, keywords:cmd.keywords}); break;
    case 'clear_projections': clearExtraSeries(); break;
    case 'load_news':       refreshNews({topic:cmd.topic, symbol:cmd.symbol}); focusPanel('news'); break;
    case 'open_news':       openNews(parseInt(cmd.index,10)); break;
    case 'add_watchlist':   addToWatchlist(cmd.symbol); focusPanel('watchlist'); break;
    case 'remove_watchlist':removeFromWatchlist(cmd.symbol); break;
    case 'focus_panel':     focusPanel(cmd.panel); break;
    case 'search_results': {
      const r = cmd.results || [];
      if(r.length){
        focusPanel('watchlist');
        logSystem('Matches: ' + r.map(a=>`${a.symbol} (${a.name})`).join(' | '));
      }
      break;
    }
    case 'toggle_indicator':toggleIndicator(String(cmd.indicator).toLowerCase(), cmd.on!==false); focusPanel('chart'); break;
  }
}
$('chatForm').addEventListener('submit', async e=>{
  e.preventDefault();

  appendChat('user',msg); input.value='';
  autoFocusFromText(msg);

  const thinking=appendChat('ai','analyzing...');

      body:JSON.stringify({message:msg,symbol:activeSymbol,session_id:SESSION_ID})})).json();

    (d.commands||[]).forEach(applyCommand);

});

/* ===================== PROJECTIONS ===================== */
async function drawProjection({symbol=null, scenario='base', days=10, shock_pct=0, label=null}={}){
  const sym=(symbol||activeSymbol).toUpperCase();
  if(sym!==activeSymbol) await loadSymbol(sym);
  const d=await (await fetch('/api/whatif',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({symbol:sym,scenario,days:parseInt(days,10)||10,
      shock_pct:parseFloat(shock_pct)||0, label:label||`${scenario} ${days}d`})})).json();
  if(!d.points || !d.points.length) return {ok:false, message:'No data to project'};
  addDashedSeries(d.points, d.label, scenario==='base'?'#33c9ff':'#ff9900');
  focusPanel('chart');
  const base = lastMetrics?.last_close || d.points[0].value;
  const last = d.points[d.points.length-1];
  logSystem(`${scenario} projection, ${days}d, on ${sym}`);
  return {ok:true, symbol:sym, scenario, horizon_days:d.points.length,
          estimated_final_price:last.value,
          estimated_return_pct:+(((last.value/base)-1)*100).toFixed(2),
          basis:'real drift and sigma from the last 60 closes'};
}

async function startCall(){
  $('callState').textContent='connecting...';
  try{
    const tokenRes=await fetch('/api/voice/token');
    if(!tokenRes.ok){
      const err=await tokenRes.json().catch(()=>({}));
      $('callState').textContent='voice not configured';
      logSystem(err.error||'Could not obtain the voice token');
      return;
    }
    const {token}=await tokenRes.json();
    const {Conversation}=await import('https://cdn.jsdelivr.net/npm/@elevenlabs/client@latest/+esm');

    conversation=await Conversation.startSession({
      conversationToken: token,
      connectionType: 'webrtc',
      clientTools,
      dynamicVariables: {
        current_watchlist: watchlist.join(', '),
        active_symbol_var: activeSymbol,
        local_time: new Date().toLocaleString('en-US'),
      },
      onConnect: ()=>{
        callActive=true;
        $('voiceBtn').classList.add('calling'); $('voiceBtn').textContent='STOP';
        $('callState').textContent='ON CALL';
        $('callState').className='text-xs text-emerald-400';
        logSystem('Call started. Everything spoken is logged here.');
        alertedKeys = new Set();
        if(!monitorTimer) monitorTimer = setInterval(monitorTick, 90000);
      },
      onDisconnect: ()=>{
        callActive=false;
        $('voiceBtn').classList.remove('calling'); $('voiceBtn').textContent='MIC';
        $('callState').textContent=''; $('vizBars').classList.add('hidden');
        resetLayout();
        if(monitorTimer){ clearInterval(monitorTimer); monitorTimer=null; }
        logSystem('Call ended.');
      },
      onUserTranscript: t => { const m=(t && t.message) || t; appendChat('user', m); autoFocusFromText(m); },
      onMessage: m => {
        if(typeof m==='string') return appendChat('ai', m);
        if(m.source==='user') appendChat('user', m.message);
        else appendChat('ai', m.message);
      },
      onModeChange: ({mode}) => $('vizBars').classList.toggle('hidden', mode!=='speaking'),
      onError: e => logSystem('Voice error: '+((e&&e.message)||e)),
    });
  }catch(err){
    $('callState').textContent='error';
    logSystem('Could not start the call: '+err.message);
  }
}
async function endCall(){ try{ await conversation?.endSession(); }catch(e){} conversation=null; }

/* ===================== LOCAL MODE (no agent_id) =====================
   Browser speech recognition -> your LLM at /api/chat -> ElevenLabs TTS.
   Only needs ELEVENLABS_API_KEY. The mic pauses while the assistant speaks
   so it never hears itself. */
let recog=null, localActive=false, speaking=false;
let recogRunning=false, wantListening=false, watchdog=null;
const audioEl = new Audio();
audioEl.preload = 'auto';

/* Chrome blocks audio until a user gesture. We unlock the element on the very
   first click on MIC, otherwise play() rejects silently and the assistant
   appears mute. */
let audioUnlocked = false;
function unlockAudio(){
  if(audioUnlocked) return;
  audioEl.src = 'data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tAwAAAAAAAAAAAAAAAAAAAAAAASW5mbwAAAA8AAAAEAAABIADAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA//8AAAAA';
  audioEl.play().then(()=>{ audioUnlocked = true; }).catch(()=>{});
}

function startLocalCall(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ logSystem('This browser does not support speech recognition. Use Chrome or Edge.'); return; }

  recog = new SR();
  recog.lang='en-US'; recog.continuous=true; recog.interimResults=false;

  // The engine reports its own lifecycle. Never assume it is running: Chrome
  // stops it on silence, on tab blur, and after ~60s, without warning.
  recog.onstart = () => { recogRunning = true; setMicState(true); };
  recog.onend   = () => { recogRunning = false; setMicState(false);
                          if(wantListening && !speaking) setTimeout(ensureListening, 250); };
  recog.onerror = e => {
    recogRunning = false;
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      logSystem('Microphone permission denied.'); endLocalCall(); return;
    }
    if(e.error !== 'no-speech' && e.error !== 'aborted') logSystem('Speech: ' + e.error);
  };

  recog.onresult = async e => {
    if(speaking) return;                      // ignore our own audio
    const text = e.results[e.results.length-1][0].transcript.trim();
    if(!text) return;
    appendChat('user', text);
    autoFocusFromText(text);                  // panel follows the topic
    await handleLocalTurn(text);
  };

  wantListening = true; localActive = true; callActive = true;
  ensureListening();
  if(!watchdog) watchdog = setInterval(ensureListening, 3000);   // safety net

  $('voiceBtn').classList.add('calling');
  $('voiceBtn').innerHTML = ICON.stop;
  $('voiceBtn').title = 'End call';
  $('callState').textContent='ON CALL';
  $('callState').className='text-xs text-emerald-400';
  logSystem('Local call started. Just talk normally.');
  alertedKeys = new Set();
  setTimeout(()=>runBriefing(true), 900);            // the desk opens the session
  if(!monitorTimer) monitorTimer = setInterval(monitorTick, 90000);
}

/* Starts recognition only when it is safe to do so. Calling start() on an
   already-running engine throws, and that exception is what used to kill the
   loop after the first reply. */
function ensureListening(){
  if(!wantListening || recogRunning || speaking || !recog) return;
  try{ recog.start(); }
  catch(err){ if(err.name !== 'InvalidStateError') logSystem('Mic: ' + err.message); }
}

function setTtsBadge(){
  const el = $('ttsBadge');
  if(!el) return;
  el.textContent = ttsMode === 'browser' ? 'BROWSER VOICE' : 'ELEVENLABS';
  el.className = 'text-[9px] px-1.5 border ' + (ttsMode === 'browser'
    ? 'text-amber-400 border-amber-800' : 'text-emerald-400 border-emerald-900');
}

function setMicState(on){
  $('liveMic').classList.toggle('hidden', !on);
}

async function handleLocalTurn(text){
  const thinking = appendChat('ai','…');
  try{
    const d = await (await fetch('/api/chat',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text, symbol:activeSymbol, session_id:SESSION_ID})})).json();
    thinking.textContent = d.reply;
    $('latency').textContent = `${d.latency_ms} ms`;
    (d.commands||[]).forEach(applyCommand);
    await speak(d.reply);
  }catch(err){ thinking.textContent='Connection error.'; }
}

/* ===================== BROWSER SPEECH ENGINE =====================
   Free and unlimited, built into Chrome and Edge. Lower quality than
   ElevenLabs but it never runs out of credits. */
let ttsMode = 'auto';           // auto | elevenlabs | browser
let browserVoice = null;

function pickBrowserVoice(){
  const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  if(!voices.length) return null;
  // Prefer a deep, natural English male voice; these are the usual suspects.
  const wanted = ['Google UK English Male','Microsoft Guy','Microsoft Christopher',
                  'Daniel','Google US English','Microsoft David','Alex'];
  for(const name of wanted){
    const v = voices.find(x => x.name.includes(name));
    if(v) return v;
  }
  return voices.find(v => v.lang.startsWith('en')) || voices[0];
}
if(window.speechSynthesis){
  browserVoice = pickBrowserVoice();
  speechSynthesis.onvoiceschanged = () => { browserVoice = pickBrowserVoice(); };
}

function speakBrowser(text){
  return new Promise(resolve => {
    if(!window.speechSynthesis){ logSystem('No speech engine in this browser.'); return resolve(); }
    speechSynthesis.cancel();                  // clears anything stuck in the queue
    const u = new SpeechSynthesisUtterance(text);
    if(browserVoice) u.voice = browserVoice;
    u.lang = (browserVoice && browserVoice.lang) || 'en-US';
    u.rate = 1.05; u.pitch = 0.95;
    let done = false;
    const finish = () => { if(!done){ done = true; resolve(); } };
    u.onend = finish;
    u.onerror = finish;
    // Chrome drops long utterances silently; a timeout guarantees the loop resumes.
    setTimeout(finish, Math.min(4000 + text.length * 70, 30000));
    speechSynthesis.speak(u);
  });
}

async function speak(text){
  if(!text) return;
  speaking = true;
  try{ recog && recog.abort(); }catch(e){}   // abort is immediate; stop() is not
  $('vizBars').classList.remove('hidden');

  if(ttsMode === 'browser'){
    await speakBrowser(text);
  } else {
    let fellBack = false;
    try{
      const res = await fetch('/api/tts',{method:'POST',
        headers:{'Content-Type':'application/json'}, body:JSON.stringify({text})});

      if(!res.ok){
        let msg = `TTS ${res.status}`, useBrowser = false, evStatus = '';
        try{
          const j = await res.json();
          if(j.error) msg = j.error;
          if(j.eleven_status) evStatus = j.eleven_status;
          useBrowser = !!j.use_browser;
        }catch(e){}
        if(useBrowser){
          ttsMode = 'browser';                 // switch once, stop retrying
          setTtsBadge();
          logSystem(`${msg}${evStatus?` [${evStatus}]`:''} - switching to the browser voice.`);
        } else {
          logSystem(msg + (evStatus?` [${evStatus}]`:''));
        }
        fellBack = true;
      } else {
        const blob = await res.blob();
        if(blob.size < 500){
          logSystem('TTS returned empty audio - switching to the browser voice.');
          ttsMode = 'browser'; setTtsBadge(); fellBack = true;
        } else {
          const url = URL.createObjectURL(blob);
          audioEl.src = url;
          await new Promise(resolve => {
            let done = false;
            const finish = () => { if(!done){ done = true; resolve(); } };
            audioEl.onended = finish;
            audioEl.onerror = () => { finish(); };
            audioEl.play().catch(err => {
              logSystem(err.name === 'NotAllowedError'
                ? 'Audio blocked by the browser - click anywhere and try again'
                : 'Audio: ' + err.message);
              finish();
            });
          });
          URL.revokeObjectURL(url);
        }
      }
    }catch(e){
      logSystem('TTS unreachable - switching to the browser voice.');
      ttsMode = 'browser'; setTtsBadge(); fellBack = true;
    }
    if(fellBack) await speakBrowser(text);    // the user still hears the answer
  }

  $('vizBars').classList.add('hidden');
  speaking = false;
  setTimeout(ensureListening, 300);   // small gap so the tail of the audio is not captured
}

function endLocalCall(){
  wantListening=false; localActive=false; callActive=false;
  if(watchdog){ clearInterval(watchdog); watchdog=null; }
  if(monitorTimer){ clearInterval(monitorTimer); monitorTimer=null; }
  try{ recog && recog.abort(); }catch(e){}
  setMicState(false);
  try{ audioEl.pause(); }catch(e){}
  $('voiceBtn').classList.remove('calling');
  $('voiceBtn').innerHTML = ICON.mic; $('voiceBtn').title='Start call';
  $('callState').textContent=''; $('vizBars').classList.add('hidden');
  resetLayout();
  logSystem('Call ended.');
}

/* When the call ends the terminal goes back to its neutral 2x2 layout, so the
   next session never starts on a panel zoomed in from the previous one. */
function resetLayout(){
  $('newsModal').classList.add('hidden-modal');
  lastTopic = null;
  focusPanel('balanced');
}

/* The server decides which mode is available. */
let voiceMode='none';
fetch('/api/voice/mode').then(r=>r.json()).then(d=>{
  voiceMode = d.mode;
  ttsMode = d.tts || 'auto';
  setTtsBadge();
  if(d.mode==='local') $('voiceBtn').title = 'Start call (local mode)';
}).catch(()=>{});

$('voiceBtn').addEventListener('click', ()=>{
  unlockAudio();
  if(callActive) return voiceMode==='agent' ? endCall() : endLocalCall();
  if(voiceMode==='agent') return startCall();
  return startLocalCall();   // local mode always works: browser STT + browser TTS
});

renderToolbar();
mountCollapseButtons();
$('stratBtn').innerHTML = ICON.flask;
$('stratClose').innerHTML = ICON.close;
$('predictBtn').innerHTML = ICON.brain;
$('simBtn').innerHTML     = ICON.wallet;
$('predictClose').innerHTML = ICON.close;
$('simClose').innerHTML     = ICON.close;
$('sendBtn').innerHTML  = ICON.send;
$('voiceBtn').innerHTML = ICON.mic;
$('clearBtn').innerHTML = ICON.trash;
$('modalClose').innerHTML = ICON.close;
$('modalLink').innerHTML = ICON.link;
$('liveMic').innerHTML = ICON.mic;

initChart();
focusPanel('balanced');
renderWatchlist();
loadSymbol(activeSymbol);
connectStream();
refreshDiversification();
appendChat('ai','Terminal ready. Hit MIC to open the call, or type your query.');
</script>
